<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhteşem Profil Kartı</title>
    <!-- Font Awesome Linki (Sosyal Medya İkonları İçin) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Genel Sayfa Ayarları ve Canlı Canlanan Arka Plan */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            overflow: hidden;
        }

        /* Arka Plan Renk Geçiş Animasyonu */
        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Cam Efektli Profil Kartı (Glassmorphism) */
        .profile-card {
            position: relative;
            width: 380px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #fff;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px);
        }

        /* Profil Resmi Alanı */
        .avatar-area {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar-area img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.4);
        }

        /* Çevrimiçi/Aktif Işığı */
        .avatar-area::after {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background: #00ff66;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px #00ff66;
        }

        /* İsim ve Unvan */
        .profile-info h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .profile-info p {
            font-size: 14px;
            color: #e0e0e0;
            font-weight: 300;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Sosyal Medya İkonları */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-icons a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 50%;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icons a:hover {
            background: #fff;
            color: #111;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* Profil Butonu */
        .profile-btn {
            display: inline-block;
            padding: 12px 35px;
            background: #fff;
            color: #111;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-area">
            <!-- Geçici bir profil resmi yerleştirdim, kendi resminin linkini koyabilirsin -->
            <img src="https://unsplash.com" alt="Profil Resmi">
        </div>
        <div class="profile-info">
            <h2>MURAT TAŞABAK</h2>
            <p>Full Stack Developer</p>
        </div>
        <div class="social-icons">
            <a href="#" target="_blank"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fab fa-x-twitter"></i></a>
        </div>
        <a href="#" class="profile-btn">Mesaj Gönder</a>
    </div>
<body>
</body>
</html>
